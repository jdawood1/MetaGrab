name: Python lint and formatting

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python code
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test downloader update decisions
        run: python -m unittest tests.test_downloader_updater tests.test_download_health
      - name: Install extractor test dependency
        run: python -m pip install "yt-dlp[default]"
      - name: Test AniZone extractor
        run: python -m unittest tests.test_anizone tests.test_analysis tests.test_selections
