[project]
name = "MetaGrab"
version = "0.1.0"
description = "Secure, Private Media and Download Manager."
authors = [
    { name = "John Dawood" }
]
requires-python = ">=3.10"

dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

# Keep the local checks and CI on the same Ruff release.
[tool.ruff]
required-version = "==0.12.11"
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# PATH and crash diagnostics must be configured before application imports.
"main.py" = ["E402"]

# Runtime requirements have a single source of truth.
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.setuptools.package-data]
"app.styles" = ["*.qss"]
