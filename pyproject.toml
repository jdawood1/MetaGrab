[project]
name = "MetaGrab"
version = "0.1.0"
description = "Secure, Private Media and Download Manager."
authors = [
    { name = "John Dawood" }
]
requires-python = ">=3.10"

dependencies = [
    "PySide6~=6.9.0",
    "yt-dlp~=2025.3.31",
    "pydub~=0.25.1",
    "tqdm~=4.67.1",
    "mutagen~=1.47.0",
    "stem~=1.8.2",
    "pyperclip~=1.9.0",
    "requests~=2.32.3",
    "PySocks~=1.7.1",
    "psutil~=7.0.0",
    "platformdirs~=4.3.7"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
